<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>學士後中醫：修仙試煉館 - Post-Bac BioChem Dungeon Master</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Silkscreen & Noto Sans TC -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; user-select: none; -webkit-user-select: none; touch-action: manipulation; background-color: #070913; color: #f1f5f9; }
        .font-pixel { font-family: 'Silkscreen', 'Noto Sans TC', monospace; }
        .bar-glow-hp { box-shadow: 0 0 10px rgba(239, 68, 68, 0.6); }
        .bar-glow-exp { box-shadow: 0 0 10px rgba(168, 85, 247, 0.6); }
        @keyframes enemyFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
        .enemy-bounce { animation: enemyFloat 2.5s ease-in-out infinite; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col justify-between overflow-hidden bg-slate-950">

    <!-- TOP HEADER / HUD -->
    <header class="h-14 bg-slate-900 border-b-2 border-slate-800 px-3 md:px-6 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center space-x-2 md:space-x-3">
            <div id="hud-avatar" class="w-9 h-9 sm:w-10 sm:h-10 rounded-lg bg-emerald-950 border-2 border-emerald-500 flex items-center justify-center text-lg shadow-md">
                🧙‍♂️
            </div>
            <div>
                <div class="flex items-center space-x-1.5">
                    <span id="hud-name" class="font-bold text-xs sm:text-sm text-emerald-300">中醫修仙者</span>
                    <span id="hud-level" class="text-[10px] bg-emerald-950 text-emerald-400 border border-emerald-800 px-1.5 rounded font-mono">Lv.1</span>
                </div>
                <div class="w-24 sm:w-32 bg-slate-950 h-2 rounded-full overflow-hidden border border-slate-800 mt-1">
                    <div id="hud-exp-bar" class="bg-gradient-to-r from-purple-600 to-fuchsia-500 h-full w-0 transition-all duration-300 bar-glow-exp"></div>
                </div>
            </div>
        </div>

        <div class="flex items-center space-x-2 sm:space-x-4">
            <div class="flex items-center space-x-1 bg-amber-950/60 border border-amber-700/60 px-2.5 py-1 rounded-lg text-amber-300 font-mono text-xs sm:text-sm">
                <i class="fa-solid fa-coins text-amber-400"></i>
                <span id="hud-gold">0</span>
            </div>
            <button onclick="openShopModal()" class="p-2 bg-slate-800 hover:bg-slate-700 text-amber-300 rounded-lg text-xs font-bold border border-slate-700 flex items-center gap-1">
                <i class="fa-solid fa-store"></i> <span class="hidden sm:inline">丹藥鋪</span>
            </button>
            <button onclick="openMistakeModal()" class="p-2 bg-slate-800 hover:bg-slate-700 text-purple-300 rounded-lg text-xs font-bold border border-slate-700 flex items-center gap-1 relative">
                <i class="fa-solid fa-book-bookmark"></i> <span class="hidden sm:inline">錯題本</span>
                <span id="badge-mistakes" class="absolute -top-1 -right-1 bg-red-600 text-white text-[9px] w-4 h-4 rounded-full flex items-center justify-center font-mono hidden">0</span>
            </button>
        </div>
    </header>

    <!-- MAIN VIEWPORT CONTAINER -->
    <main id="main-container" class="flex-1 relative overflow-hidden flex flex-col justify-between bg-slate-950">

        <!-- SCREEN 1: TITLE SCREEN -->
        <div id="screen-title" class="absolute inset-0 z-30 bg-slate-950 flex flex-col items-center justify-between p-6 overflow-y-auto">
            <div class="my-auto flex flex-col items-center text-center max-w-md w-full">
                <div class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 mb-2 font-pixel tracking-wider">
                    學士後中醫
                </div>
                <div class="text-xl sm:text-2xl font-extrabold text-amber-300 mb-6 tracking-widest border-b-2 border-amber-500/50 pb-2 w-full">
                    ⚔️ 修仙試煉館：生化魔宮 ⚔️
                </div>

                <div class="w-full bg-slate-900 border border-slate-800 rounded-2xl p-4 mb-6 shadow-2xl text-left">
                    <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-wide">選擇你的後中醫試煉角色：</label>
                    <div class="grid grid-cols-3 gap-2">
                        <button onclick="selectClass('tcm')" id="class-tcm" class="class-card p-3 rounded-xl border-2 border-emerald-500 bg-emerald-950/40 flex flex-col items-center text-center">
                            <span class="text-2xl mb-1">🧙‍♂️</span>
                            <span class="text-xs font-bold text-emerald-300">中醫修仙者</span>
                            <span class="text-[9px] text-slate-400 mt-1">HP +20%</span>
                        </button>
                        <button onclick="selectClass('alchemist')" id="class-alchemist" class="class-card p-3 rounded-xl border-2 border-slate-800 bg-slate-900 flex flex-col items-center text-center">
                            <span class="text-2xl mb-1">🧪</span>
                            <span class="text-xs font-bold text-slate-300">基因煉金術師</span>
                            <span class="text-[9px] text-slate-400 mt-1">金幣 +100</span>
                        </button>
                        <button onclick="selectClass('mage')" id="class-mage" class="class-card p-3 rounded-xl border-2 border-slate-800 bg-slate-900 flex flex-col items-center text-center">
                            <span class="text-2xl mb-1">⚡</span>
                            <span class="text-xs font-bold text-slate-300">分子法術師</span>
                            <span class="text-[9px] text-slate-400 mt-1">攻擊力 +15%</span>
                        </button>
                    </div>
                </div>

                <button id="btn-start-game" onclick="startGame()" class="w-full py-3.5 bg-gradient-to-r from-emerald-600 via-teal-600 to-cyan-600 hover:from-emerald-500 hover:to-cyan-500 text-slate-950 font-black text-base sm:text-lg rounded-xl shadow-xl transition-all transform hover:scale-105 active:scale-95 mb-3">
                    踏入試煉魔宮 (Start Game)
                </button>
            </div>
            <div class="text-[10px] text-slate-600 font-mono text-center">
                專為考取中國醫、義守、慈濟學士後中醫/後西醫生物與化學考題設計
            </div>
        </div>

        <!-- SCREEN 2: LEVEL SELECT -->
        <div id="screen-floors" class="absolute inset-0 z-20 bg-slate-950 hidden flex-col p-4 sm:p-6 overflow-y-auto">
            <div class="max-w-xl mx-auto w-full my-auto">
                <div class="flex justify-between items-center mb-4 border-b border-slate-800 pb-2">
                    <div>
                        <h2 class="text-lg font-extrabold text-amber-300">🏰 選擇試煉層級 (Select Floor)</h2>
                        <p class="text-xs text-slate-400">通關前一層試煉以解鎖下一層魔宮</p>
                    </div>
                    <button onclick="showTitleScreen()" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-2.5 py-1.5 rounded-lg">主選單</button>
                </div>
                <div id="floor-list" class="space-y-3"></div>
            </div>
        </div>

        <!-- SCREEN 3: RPG BATTLE -->
        <div id="screen-battle" class="absolute inset-0 z-10 hidden flex-col justify-between p-2 sm:p-4 bg-slate-950">
            <div id="battle-arena" class="relative flex-1 bg-gradient-to-b from-slate-900 via-slate-950 to-slate-900 border-2 border-slate-800 rounded-2xl p-3 sm:p-4 flex flex-col justify-between overflow-hidden shadow-2xl mb-2">
                <div class="flex justify-between items-start z-10">
                    <div class="bg-slate-950/80 border border-slate-800 p-2.5 rounded-xl w-36 sm:w-48 backdrop-blur-sm">
                        <div class="flex justify-between items-center text-[11px] mb-1">
                            <span class="font-bold text-emerald-300" id="battle-player-name">中醫修仙者</span>
                            <span class="font-mono text-slate-400 text-[10px]" id="battle-player-hp-num">100/100</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden border border-slate-700">
                            <div id="battle-player-hp-bar" class="bg-gradient-to-r from-emerald-500 to-teal-400 h-full w-full transition-all duration-300 bar-glow-hp"></div>
                        </div>
                    </div>

                    <div class="bg-slate-950/80 border border-slate-800 p-2.5 rounded-xl w-40 sm:w-56 backdrop-blur-sm text-right">
                        <div class="flex justify-between items-center text-[11px] mb-1">
                            <span class="font-mono text-red-400 text-[10px]" id="battle-enemy-hp-num">100/100</span>
                            <span class="font-bold text-red-300 truncate max-w-[100px]" id="battle-enemy-name">變性蛋白質魔</span>
                        </div>
                        <div class="w-full bg-slate-800 h-2.5 rounded-full overflow-hidden border border-slate-700">
                            <div id="battle-enemy-hp-bar" class="bg-gradient-to-r from-red-600 to-rose-500 h-full w-full transition-all duration-300"></div>
                        </div>
                    </div>
                </div>

                <div class="my-auto flex flex-col items-center justify-center relative z-10">
                    <div id="enemy-sprite-container" class="w-28 h-28 sm:w-36 sm:h-36 enemy-bounce flex items-center justify-center filter drop-shadow-[0_0_20px_rgba(239,68,68,0.4)] text-6xl">
                        🧬
                    </div>
                </div>

                <div id="battle-toast" class="bg-slate-900/90 border border-slate-700 rounded-xl px-3 py-1.5 text-center text-xs font-bold text-amber-300 shadow-lg max-w-md mx-auto z-10">
                    戰鬥開始！請選擇正確答案發動攻擊！
                </div>
            </div>

            <div class="bg-slate-900 border-2 border-slate-800 rounded-2xl p-3 sm:p-4 flex flex-col justify-between shadow-2xl">
                <div class="mb-3">
                    <div class="flex justify-between items-center mb-1">
                        <span id="question-category" class="text-[10px] bg-purple-950 text-purple-300 border border-purple-800 px-2 py-0.5 rounded-full font-bold">1F 生物學</span>
                        <span id="question-count" class="text-[10px] text-slate-400 font-mono">第 1 題</span>
                    </div>
                    <div id="question-text" class="text-xs sm:text-sm font-bold text-slate-100 leading-relaxed min-h-[48px] flex items-center">
                        題目載入中...
                    </div>
                </div>
                <div id="options-container" class="grid grid-cols-1 sm:grid-cols-2 gap-2"></div>
            </div>
        </div>
    </main>

    <!-- EXPLANATION MODAL -->
    <div id="modal-explanation" class="fixed inset-0 bg-black/85 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-slate-900 border-2 border-slate-700 rounded-2xl p-5 w-full max-w-lg shadow-2xl flex flex-col max-h-[85vh]">
            <h3 id="explanation-title" class="text-sm font-bold text-amber-300 mb-2">考點詳細解析：</h3>
            <div id="explanation-body" class="flex-1 bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-300 overflow-y-auto leading-relaxed mb-4"></div>
            <button onclick="nextQuestion()" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold text-xs sm:text-sm rounded-xl">繼續試煉</button>
        </div>
    </div>

    <!-- GAME ENGINE CODE -->
    <script>
        const GOOGLE_SHEET_API = "https://script.google.com/macros/s/AKfycbxX8yxTFuJRvQYBfUae7lfA081-n2oiirWnYiqvmAOW3rdbxjx7rThtMnFch05nAywn/exec";

        // 預設備用題庫 (包含 floor1~floor4)
        const FALLBACK_QUESTION_BANK = {
            floor1: [
                { id: 'f1_1', category: '細胞生物學', type: 'choice', q: '下列何者為細胞膜質膜（Plasma membrane）雙層脂質的主要成分？', options: ['磷脂質 (Phospholipids)', '中性脂肪', '核酸', '澱粉'], ans: 0, exp: '細胞膜主要由雙層磷脂質構成，親水頭朝外，疏水尾朝內。' },
                { id: 'f1_2', category: '細胞生物學', type: 'choice', q: '胞飲作用（Pinocytosis）屬於下列哪種物質運輸方式？', options: ['被動運輸', '主動運輸 (內吞作用)', '簡單擴散', '促進擴散'], ans: 1, exp: '胞飲作用是細胞內吞液體顆粒的巨量運輸方式，需要消耗 ATP。' }
            ],
            floor2: [
                { id: 'f2_1', category: '普通化學', type: 'choice', q: '關於 SN2 反應特性的敘述，下列何者正確？', options: ['一步完成且構型翻轉 (Inversion)', '兩步完成產生碳陽離子', '反應速率與親核試劑無關', '一級碳反應最慢'], ans: 0, exp: 'SN2 為雙分子親核取代，親核基從背面攻擊導致構型翻轉。' }
            ],
            floor3: [
                { id: 'f3_1', category: '生物化學', type: 'choice', q: '酵素動力學中，Km 值越小代表酵素與底物的親和力？', options: ['越高', '越低', '無關', '等於零'], ans: 0, exp: 'Km 代表達半數 Vmax 所需的底物濃度，Km 越低表示極低濃度就能結合，親和力越高。' }
            ],
            floor4: [
                { id: 'f4_1', category: '綜合試煉', type: 'choice', q: 'Lac operon 基因調控中，當乳糖存在且葡萄糖缺乏時，表現量為何？', options: ['大量表現 (High Expressed)', '完全不表現', '受到抑制', '不受影響'], ans: 0, exp: '無葡萄糖使 cAMP 增加結合 CAP 蛋白，且乳糖去抑制 Repressor，達成最大轉錄。' }
            ]
        };

        let QUESTION_BANK = jQueryExtend({}, FALLBACK_QUESTION_BANK);
        let player = { hp: 100, maxHp: 100, gold: 0, exp: 0, level: 1, currentClass: 'tcm' };
        let currentBattle = { floor: 'floor1', enemyHp: 100, enemyMaxHp: 100, qIndex: 0, questions: [] };

        function jQueryExtend(target, src) {
            return JSON.parse(JSON.stringify(src));
        }

        // 從 API 載入並重構題庫
        async function loadQuestionBank() {
            const btn = document.getElementById('btn-start-game');
            if (btn) btn.innerText = "⏳ 下載試煉題庫中...";

            try {
                const response = await fetch(GOOGLE_SHEET_API);
                if (!response.ok) throw new Error("API 響應異常");
                const data = await response.json();

                if (data) {
                    let formattedBank = { floor1: [], floor2: [], floor3: [], floor4: [] };

                    if (Array.isArray(data)) {
                        data.forEach((q, idx) => {
                            let f = q.floor || `floor${(idx % 4) + 1}`;
                            if (!formattedBank[f]) formattedBank[f] = [];
                            formattedBank[f].push(q);
                        });
                    } else if (typeof data === 'object') {
                        Object.keys(data).forEach(f => {
                            formattedBank[f] = data[f];
                        });
                    }

                    // 確保每一層都至少有題目
                    Object.keys(FALLBACK_QUESTION_BANK).forEach(f => {
                        if (!formattedBank[f] || formattedBank[f].length === 0) {
                            formattedBank[f] = FALLBACK_QUESTION_BANK[f];
                        }
                    });

                    QUESTION_BANK = formattedBank;
                    console.log("成功解析題庫：", QUESTION_BANK);
                }
            } catch (err) {
                console.warn("無法連線至 Google Sheets API，使用本地預設題庫：", err);
                QUESTION_BANK = FALLBACK_QUESTION_BANK;
            } finally {
                if (btn) btn.innerText = "踏入試煉魔宮 (Start Game)";
            }
        }

        function startGame() {
            document.getElementById('screen-title').classList.add('hidden');
            document.getElementById('screen-floors').classList.remove('hidden');
            renderFloors();
        }

        function showTitleScreen() {
            document.getElementById('screen-floors').classList.add('hidden');
            document.getElementById('screen-title').classList.remove('hidden');
        }

        function renderFloors() {
            const container = document.getElementById('floor-list');
            const floors = [
                { id: 'floor1', name: '1F 細胞生物學試煉', desc: '基礎細胞構造與物質運輸' },
                { id: 'floor2', name: '2F 普通化學/有機化學魔宮', desc: '反應機制與熱力學考題' },
                { id: 'floor3', name: '3F 生物化學經絡殿', desc: '酵素動力學與代謝途徑' },
                { id: 'floor4', name: '4F 後中醫終極試煉', desc: '跨學科高難度綜合解析' }
            ];

            container.innerHTML = floors.map(f => {
                const count = (QUESTION_BANK[f.id] || []).length;
                return `
                    <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex items-center justify-between">
                        <div>
                            <div class="font-bold text-amber-300 text-sm">${f.name}</div>
                            <div class="text-xs text-slate-400 mt-0.5">${f.desc} (${count} 題)</div>
                        </div>
                        <button onclick="startFloor('${f.id}')" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold text-xs rounded-lg shadow-lg">
                            挑戰
                        </button>
                    </div>
                `;
            }).join('');
        }

        function startFloor(floorId) {
            const qList = QUESTION_BANK[floorId] || FALLBACK_QUESTION_BANK.floor1;
            currentBattle = {
                floor: floorId,
                enemyHp: 100,
                enemyMaxHp: 100,
                qIndex: 0,
                questions: qList
            };

            document.getElementById('screen-floors').classList.add('hidden');
            document.getElementById('screen-battle').classList.remove('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const q = currentBattle.questions[currentBattle.qIndex % currentBattle.questions.length];
            document.getElementById('question-category').innerText = q.category || '中醫考題';
            document.getElementById('question-count').innerText = `第 ${currentBattle.qIndex + 1} 題`;
            document.getElementById('question-text').innerText = q.q;

            const optsContainer = document.getElementById('options-container');
            optsContainer.innerHTML = (q.options || []).map((opt, idx) => `
                <button onclick="checkAnswer(${idx})" class="p-3 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-left text-xs font-bold rounded-xl text-slate-200 hover:text-amber-300 transition-all">
                    ${String.fromCharCode(65 + idx)}. ${opt}
                </button>
            `).join('');
        }

        function checkAnswer(selectedIdx) {
    const q = currentBattle.questions[currentBattle.qIndex % currentBattle.questions.length];
    const isCorrect = (selectedIdx === q.ans);

    let toastText = "";
    
    if (isCorrect) {
        // 1. 答對：玩家攻擊怪物 (扣怪物 HP)
        const damage = Math.floor(Math.random() * 15) + 25; // 造成 25~40 點傷害
        currentBattle.enemyHp = Math.max(0, currentBattle.enemyHp - damage);
        toastText = `✨ 回答正確！施展生化法術造成 ${damage} 點暴擊傷害！`;
        
        // 答對獲得金幣與 EXP
        player.gold += 10;
        player.exp += 15;
        updateHUD();
    } else {
        // 2. 答錯：怪物反擊玩家 (扣玩家 HP)
        const damage = Math.floor(Math.random() * 10) + 15; // 受到 15~25 點傷害
        player.hp = Math.max(0, player.hp - damage);
        toastText = `❌ 回答錯誤！遭到變性魔反擊，受到 ${damage} 點傷害！`;
    }

    // 3. 即時更新血條 UI 與數字
    updateBattleBars();

    // 4. 更新戰鬥 Hint 提示文字
    const toastEl = document.getElementById('battle-toast');
    if (toastEl) toastEl.innerText = toastText;

    // 5. 顯示解析彈窗
    const modal = document.getElementById('modal-explanation');
    const body = document.getElementById('explanation-body');
    
    body.innerHTML = `
        <div class="${isCorrect ? 'text-emerald-400' : 'text-red-400'} font-bold mb-2">
            ${isCorrect ? '✨ 答對了！' : '❌ 答錯了！'}
        </div>
        <div class="text-slate-300 leading-relaxed">${q.exp || '無詳細考點解析。'}</div>
    `;
    modal.classList.remove('hidden');
}

// 實時更新戰鬥中的玩家與怪物血條
function updateBattleBars() {
    // 玩家血條
    const playerHpBar = document.getElementById('battle-player-hp-bar');
    const playerHpNum = document.getElementById('battle-player-hp-num');
    if (playerHpBar) playerHpBar.style.width = `${(player.hp / player.maxHp) * 100}%`;
    if (playerHpNum) playerHpNum.innerText = `${player.hp}/${player.maxHp}`;

    // 怪物血條
    const enemyHpBar = document.getElementById('battle-enemy-hp-bar');
    const enemyHpNum = document.getElementById('battle-enemy-hp-num');
    if (enemyHpBar) enemyHpBar.style.width = `${(currentBattle.enemyHp / currentBattle.enemyMaxHp) * 100}%`;
    if (enemyHpNum) enemyHpNum.innerText = `${currentBattle.enemyHp}/${currentBattle.enemyMaxHp}`;
}

// 更新頂部 HUD (金幣、經驗值)
function updateHUD() {
    const goldEl = document.getElementById('hud-gold');
    const expBar = document.getElementById('hud-exp-bar');
    if (goldEl) goldEl.innerText = player.gold;
    if (expBar) expBar.style.width = `${(player.exp % 100)}%`;
}

function nextQuestion() {
    document.getElementById('modal-explanation').classList.add('hidden');

    // 檢查戰鬥勝負條件
    if (currentBattle.enemyHp <= 0) {
        alert("🎉 恭喜！你擊敗了魔物，順利通關此層試煉！獲得 100 金幣與 50 經驗值！");
        player.gold += 100;
        player.exp += 50;
        updateHUD();
        // 戰鬥結束，回到試煉選擇選單
        document.getElementById('screen-battle').classList.add('hidden');
        document.getElementById('screen-floors').classList.remove('hidden');
        return;
    }

    if (player.hp <= 0) {
        alert("💀 修仙道心崩潰...（HP歸零），請回調養氣血後重新挑戰！");
        player.hp = player.maxHp; // 滿血復活
        updateBattleBars();
        document.getElementById('screen-battle').classList.add('hidden');
        document.getElementById('screen-floors').classList.remove('hidden');
        return;
    }

    // 進入下一題
    currentBattle.qIndex++;
    renderQuestion();
}

        function selectClass(c) {
            player.currentClass = c;
            document.querySelectorAll('.class-card').forEach(el => {
                el.classList.remove('border-emerald-500', 'bg-emerald-950/40');
                el.classList.add('border-slate-800', 'bg-slate-900');
            });
            document.getElementById(`class-${c}`).classList.add('border-emerald-500', 'bg-emerald-950/40');
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await loadQuestionBank();
        });
    </script>
